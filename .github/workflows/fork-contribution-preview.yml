name: Fork Contribution Preview

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  preview-contributed-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - name: Preview contributed workflow
        env:
          PREVIEW_SUPPORT_BUNDLE_B64: ${{ secrets.PREVIEW_SUPPORT_BUNDLE_B64 }}
        run: ./scripts/preview-contributed-workflow.sh
      - name: Record preview result
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body "Automated workflow preview completed."
